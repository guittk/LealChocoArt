<meta name="theme-color" content="#FFFBFD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141019" media="(prefers-color-scheme: dark)">
<script>
/* Applies the saved theme before first paint so a visitor who picked a theme
   that differs from their OS setting never sees the other one flash. */
(function(){
  try {
    var t = localStorage.getItem('lca-theme');
    if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch(e){}
})();
</script>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
